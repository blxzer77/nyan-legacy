[package]
name = "nyan-coding-agent-provider-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyan-coding-agent-core = { path = "../nyan-coding-agent-core" }
nyan-coding-agent-provider = { path = "../nyan-coding-agent-provider" }
getrandom = { version = "=0.4.3", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "gzip"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }

[lints]
workspace = true
