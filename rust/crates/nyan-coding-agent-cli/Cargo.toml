[package]
name = "nyan-coding-agent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nyan-coding-agent"
path = "src/main.rs"

[dependencies]
nyan-coding-agent-auth = { path = "../nyan-coding-agent-auth" }
nyan-coding-agent-core = { path = "../nyan-coding-agent-core" }
nyan-coding-agent-models = { path = "../nyan-coding-agent-models" }
nyan-coding-agent-protocol = { path = "../nyan-coding-agent-protocol" }
nyan-coding-agent-session = { path = "../nyan-coding-agent-session" }
nyan-coding-agent-provider = { path = "../nyan-coding-agent-provider" }
nyan-coding-agent-provider-http = { path = "../nyan-coding-agent-provider-http" }
nyan-coding-agent-runtime = { path = "../nyan-coding-agent-runtime" }
nyan-coding-agent-tools = { path = "../nyan-coding-agent-tools" }
serde_json = "=1.0.154"
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "time", "net", "signal"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "time", "net", "io-util"] }

[lints]
workspace = true
