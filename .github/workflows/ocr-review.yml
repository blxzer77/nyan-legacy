# OCR review — batch AI code review of what landed on main, reported as one issue per run.
#
# It no longer runs on every push to a pull request. A review at the highest effort takes tens of minutes and holds one
# of the six self-hosted slots, and most pushes are superseded by the next one before anyone reads the result. Two
# shapes remain (see .agents/notes/implemented/process/2026-10-18-ocr-review-cadence.md):
#
#   - nightly (schedule): the range from the commit the last successful scheduled review ran on, to the tip of main.
#     The bookmark is that run's head_sha, so it needs no stored state and a failed run does not move it.
#   - on demand (workflow_dispatch): `since-last-tag` before pushing a release tag, or `custom` with a base commit.
#     Manual runs never move the nightly bookmark.
#
# The review is advisory. It opens an issue; it does not comment on a pull request, does not fail a build and is not
# part of `Merge gate`. A finding blocks something only after a reproduction or a deterministic rule confirms it.
#
# Why self-hosted: the dispatch service lives on nyan-dev-02 (10.144.0.3) and is reachable only on the EasyTier
# mesh, so a GitHub-hosted runner cannot reach it. The release workflow runs on hosted runners for the same
# reason it cannot call this one.
# Nothing here runs for a pull request, so a fork can never reach this runner.
#
# No timeout is set on the review itself: a review runs as long as the range needs. The only ceiling is GitHub's own
# hard limit, jobs.timeout-minutes at 360, which is the largest legal value and is declared explicitly.
#
# OCR reports status=partial when some files could not be reviewed; the rendered text then names them, so a partial
# run is never mistaken for a clean one. The run still counts as reviewed.
#
# Secrets needed (repo Settings -> Secrets and variables -> Actions):
#   OCR_DISPATCH_URL    default http://10.144.0.3:50007/ocr  (EasyTier mesh + nginx)
#   OCR_DISPATCH_TOKEN  must equal /etc/ocr-dispatch.token on dev-02
#
# The dispatch server holds the model credential. The runner only ships the diff and receives the rendered text.

name: OCR review

on:
  schedule:
    # 18:30 UTC. Scheduled runs on this repository start hours late (the daily scan, due 07:37 UTC, started 4-9 hours
    # after it), so this is a time of day to aim at, not a time it will start.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      range:
        description: What to review
        type: choice
        default: since-last-review
        options:
          - since-last-review
          - since-last-tag
          - custom
      base:
        description: Base commit, used only when range is custom (reviews base..the ref this run was started on)
        type: string
        default: ''

concurrency:
  # One review at a time, and a running review is never cancelled by a newer one.
  group: ocr-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  # A task profile, not a model id: the dispatch host's gateway resolves it to a deep-tier candidate and fails over
  # inside that tier. See the gateway section of .agents/notes/proposed/process/2026-10-19-pipeline-implementation-plan.md.
  OCR_MODEL: review.deep
  # The OCR command behind the dispatch service accepts low, medium and high; "xhigh" is rejected there
  # (`--effort: invalid effort "xhigh": must be one of low, medium, high`, checked 2026-10-18). High is its maximum
  # for the OCR dispatcher itself; the model's reasoning strength is sent separately below.
  OCR_EFFORT: high
  # Files per review are partitioned across this many OCR processes on the dispatch host. One process is one serial
  # agent loop: 15 files took 67 minutes alone and 26 minutes across 4 shards, so the shard count is roughly the speedup
  # until the model provider becomes the limit. Results are merged, and any failed shard makes the whole run `partial`.
  OCR_SHARDS: '4'
  # A review budget, in minutes, passed to OCR as `--timeout`. 0 means no budget, which is what this used to send: one
  # run then spent over an hour on a 767-line diff (28 files, 20 of them tests, every call at max thinking) and was
  # still going. OCR reports what it covered when it stops, so a cut run is `partial` with the uncovered files named,
  # never a clean-looking pass.
  OCR_TIMEOUT_MINUTES: '60'

jobs:
  review:
    name: AI code review (OCR)
    runs-on: [self-hosted, Linux, X64, repo-nyan]
    timeout-minutes: 360
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.range }}
          CUSTOM_BASE: ${{ inputs.base }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          kind="${REQUESTED:-since-last-review}"
          if [ "$EVENT" = schedule ]; then kind=since-last-review; fi

          base=""
          case "$kind" in
            since-last-review)
              # The commit the last successful scheduled review ran on. Empty before the first one.
              base="$(gh api "repos/$REPO/actions/workflows/ocr-review.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
              ;;
            since-last-tag)
              tag="$(git describe --tags --abbrev=0 --match 'nyan-v*' "$head" 2>/dev/null || true)"
              if [ -n "$tag" ]; then base="$(git rev-list -n 1 "$tag")"; fi
              ;;
            custom)
              if [ -z "$CUSTOM_BASE" ]; then
                echo "::error::range=custom needs a base commit"
                exit 1
              fi
              base="$(git rev-parse --verify "$CUSTOM_BASE^{commit}")"
              ;;
            *)
              echo "::error::unknown range: $kind"
              exit 1
              ;;
          esac

          # A bookmark that is not in this history (a rewritten branch, a run started on another ref) cannot be diffed.
          # A base the caller named is never replaced silently: that run fails instead of reviewing something else.
          # A bookmark is replaced, but never silently: the report says that earlier commits were not reviewed. Failing
          # instead would stall the nightly for good, because a failed run never moves the bookmark.
          note=""
          if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" "$head"; then
            if [ "$kind" = custom ]; then
              echo "::error::$base is not an ancestor of $head, so there is no range between them"
              exit 1
            fi
            echo "::warning::$base is not an ancestor of $head; falling back to the last 24 hours"
            note="The previous review point ${base:0:9} is not in this history, so this range starts 24 hours back. Commits before that were not reviewed."
            base=""
          fi
          if [ -z "$base" ]; then
            base="$(git rev-list -1 --before='24 hours ago' "$head" || true)"
            echo "No earlier review to continue from: reviewing the last 24 hours (base ${base:-none})."
          fi

          {
            echo "kind=$kind"
            echo "head=$head"
            echo "base=$base"
            echo "note=$note"
          } >> "$GITHUB_OUTPUT"

      - name: Build the diff
        id: diff
        if: steps.range.outputs.base != ''
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          DIFF="$RUNNER_TEMP/range.diff"
          # Lockfiles and the generated one-line model catalogs make a range enormous and say nothing a reviewer can use:
          # the dependency scans cover the first, a catalog refresh is regenerated from source.
          git diff "$BASE" "$HEAD" -- . ':(exclude)*package-lock.json' ':(exclude)packages/ai/src/providers/data/*.json' > "$DIFF"
          {
            echo "lines=$(wc -l < "$DIFF")"
            echo "commits=$(git rev-list --count "$BASE..$HEAD")"
            echo "files=$(git diff --name-only "$BASE" "$HEAD" -- . ':(exclude)*package-lock.json' ':(exclude)packages/ai/src/providers/data/*.json' | wc -l)"
          } >> "$GITHUB_OUTPUT"
          [ -s "$DIFF" ] || echo "empty=true" >> "$GITHUB_OUTPUT"

      - name: Nothing to review
        if: steps.range.outputs.base == '' || steps.diff.outputs.empty == 'true'
        run: echo "::notice::The range is empty, so there is nothing to review."

      - name: Request review from ocr-dispatch
        if: steps.range.outputs.base != '' && steps.diff.outputs.empty != 'true'
        env:
          URL: ${{ secrets.OCR_DISPATCH_URL || 'http://10.144.0.3:50007/ocr' }}
          TOKEN: ${{ secrets.OCR_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.range.outputs.head }}
          BASE: ${{ steps.range.outputs.base }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          if not os.environ.get("TOKEN"):
              print("::error::OCR_DISPATCH_TOKEN is not set")
              sys.exit(1)
          diff = open(os.path.join(os.environ["RUNNER_TEMP"], "range.diff"), encoding="utf-8").read()
          payload_data = {
              "repo": os.environ["REPO"],
              "sha": os.environ["SHA"],
              "base_sha": os.environ["BASE"],
              "diff": diff,
              "model": os.environ["OCR_MODEL"],
              # `effort` is the dispatch service's accepted low/medium/high setting for OCR's own planning. The model's
              # thinking level is not set here any more: the gateway writes `reasoning_effort` from the tier, so a value
              # sent from this workflow would be ignored and only look meaningful.
              "effort": os.environ["OCR_EFFORT"],
              "timeout_minutes": int(os.environ["OCR_TIMEOUT_MINUTES"]),
              "shards": int(os.environ["OCR_SHARDS"]),
          }
          payload = json.dumps(payload_data).encode()
          req = urllib.request.Request(
              os.environ["URL"].rstrip("/") + "/review",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["TOKEN"],
              },
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=None) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as exc:
              data = {"ok": False, "error": "HTTP %s: %s" % (exc.code, exc.read(300)[:300])}
          except Exception as exc:  # noqa: BLE001
              data = {"ok": False, "error": "dispatch unreachable: %s" % exc}

          print("dispatch ok=%s status=%s error=%s" % (data.get("ok"), data.get("status"), data.get("error")))
          if not data.get("ok"):
              # A failed review fails the job. The nightly bookmark is the last successful run, so the range is
              # retried together with the next one instead of being skipped.
              print("::error::OCR review did not complete: %s" % data.get("error", "unknown"))
              sys.exit(1)
          open(os.path.join(os.environ["RUNNER_TEMP"], "ocr_comment.md"), "w", encoding="utf-8").write(data.get("comment") or "")
          PY

      # The full text is kept before anything else is attempted, so a problem reporting it never loses a finished review.
      # An upload that fails must not stop the report either: a failed step skips every step after it by default, and the
      # report below also carries the text.
      - name: Keep the full review
        if: steps.range.outputs.base != '' && steps.diff.outputs.empty != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-review
          path: ${{ runner.temp }}/ocr_comment.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Report the review
        if: steps.range.outputs.base != '' && steps.diff.outputs.empty != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          KIND: ${{ steps.range.outputs.kind }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          COMMITS: ${{ steps.diff.outputs.commits }}
          FILES: ${{ steps.diff.outputs.files }}
          LINES: ${{ steps.diff.outputs.lines }}
          NOTE: ${{ steps.range.outputs.note }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const review = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'ocr_comment.md'), 'utf8');
            if (!review.includes('<!-- ocr-review -->')) {
              core.setFailed('the rendered review lacks its marker; refusing to report it');
              return;
            }
            const { KIND, BASE, HEAD, COMMITS, FILES, LINES, NOTE, OCR_MODEL, OCR_EFFORT } = process.env;
            const range = `${BASE.slice(0, 9)}..${HEAD.slice(0, 9)}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const header = [
              `**Range:** \`${range}\` (${KIND}), ${COMMITS} commits, ${FILES} files, ${LINES} diff lines`,
              `**Review:** \`${OCR_MODEL}\` (the tier sets the model and its thinking level), OCR planning effort \`${OCR_EFFORT}\`. Advisory: nothing here blocks a merge or a release until a reproduction or a rule confirms it.`,
              `**Compare:** ${context.serverUrl}/${owner}/${repo}/compare/${BASE}...${HEAD}`,
              `**Run:** ${runUrl}`,
              ...(NOTE ? ['', `> **Note:** ${NOTE}`] : []),
              '',
            ].join('\n');

            // The run summary always gets the review: it needs no repository setting. A step summary is limited to 1 MiB,
            // and failing to write it must not stop the issue below, so cut it and carry on.
            try {
              const summary = header + '\n' + review;
              await core.summary.addRaw(summary.length > 900000 ? summary.slice(0, 900000) + '\n\n> Cut: the full text is the `ocr-review` artifact.\n' : summary).write();
            } catch (error) {
              core.warning(`could not write the run summary: ${error.message}`);
            }

            // An issue body is limited to 65,536 characters; the full text is also the run artifact.
            const limit = 60000;
            let text = review;
            if (header.length + text.length > limit) {
              text = text.slice(0, limit - header.length - 400) +
                `\n\n> The review was cut to fit an issue. The full text is the \`ocr-review\` artifact of [this run](${runUrl}).\n`;
            }
            try {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: 'ocr-review', color: '5319e7', description: 'Batch AI review result' });
              } catch (error) {
                if (error.status !== 422) throw error; // 422: the label already exists
              }
              const { data: issue } = await github.rest.issues.create({
                owner, repo,
                title: `OCR review: ${range} (${KIND})`,
                body: header + '\n' + text,
                labels: ['ocr-review'],
              });
              core.info(`opened issue #${issue.number}: ${issue.html_url}`);
            } catch (error) {
              if (error.status === 410) {
                // 410 Gone: "Issues has been disabled in this repository". The review is not lost, only less visible.
                core.warning('Issues are disabled in this repository, so this review is only in the run summary and the ocr-review artifact. Enable Issues to get one issue per review.');
                return;
              }
              throw error;
            }
