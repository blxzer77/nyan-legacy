name: Rust Coding Agent

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install NASM for the rustls crypto provider
        # aws-lc-sys assembles with NASM on Windows MSVC. This step was added without a
        # Windows run to confirm it is needed; remove it if the first run shows it is not.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Check workspace
        working-directory: rust
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        working-directory: rust
        run: cargo test --workspace --locked
